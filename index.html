<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>UAV Forecast — Drone Uçuş Hava Durumu</title>
    <meta name="description" content="Drone ve İHA pilotları için gerçek zamanlı hava durumu, irtifa rüzgar profili, Kp indeksi ve GNSS uydu analizi." />
    <meta name="theme-color" content="#090c13" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      (function () {
        var theme;
        try { theme = localStorage.getItem('uav_theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#090c13' : '#e9e7e1');
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="UAV Forecast — Drone Flight Weather" />
    <meta property="og:description" content="Real-time weather, wind profile, space weather and GNSS intelligence for drone pilots." />
    <meta property="og:image" content="./icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>UAV Forecast requires JavaScript.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
